# ─────────────────────────────────────────────────────────────────
# Namespace — isolate shopping resources
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: shopping

---
# ─────────────────────────────────────────────────────────────────
# ConfigMap — non-sensitive environment configuration
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: shopping-config
  namespace: shopping
data:
  # JWT expiry for access tokens
  JWT_EXPIRES_IN: "7d"

  # Backend Node environment
  NODE_ENV: "production"

  # PostgreSQL connection details (host/port only — credentials in Secret)
  DB_HOST: "postgres-service"          # ClusterIP service name for in-cluster DB
                                       # Replace with Cloud SQL proxy address for managed DB
  DB_PORT: "5432"
  DB_NAME: "shopping_db"

  # CORS allowed origin(s)
  CORS_ORIGIN: "https://shop.example.com"

---
# ─────────────────────────────────────────────────────────────────
# Secret — sensitive credentials
#
# IMPORTANT: Do NOT commit real values here.
# In production, populate this Secret via:
#   • kubectl create secret generic shopping-secret \
#       --from-literal=DATABASE_URL='postgres://user:pass@host:5432/db' \
#       --from-literal=JWT_SECRET='<long-random-string>' \
#       --namespace shopping
# Or use External Secrets Operator / GCP Secret Manager / Vault.
#
# The base64 values below are PLACEHOLDERS only (value = "CHANGE_ME").
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: shopping-secret
  namespace: shopping
type: Opaque
data:
  # echo -n 'postgres://shopping_user:CHANGE_ME@postgres-service:5432/shopping_db' | base64
  DATABASE_URL: cG9zdGdyZXM6Ly9zaG9wcGluZ191c2VyOkNIQU5HRV9NRUBwb3N0Z3Jlcy1zZXJ2aWNlOjU0MzIvc2hvcHBpbmdfZGI=

  # echo -n 'CHANGE_ME_USE_A_LONG_RANDOM_STRING_AT_LEAST_64_CHARS' | base64
  JWT_SECRET: Q0hBTkdFX01FX1VTRV9BX0xPTkdfUkFORE9NX1NUUklOR19BVF9MRUFTVF82NF9DSEFSUw==

  # echo -n 'CHANGE_ME_POSTGRES_PASSWORD' | base64
  POSTGRES_PASSWORD: Q0hBTkdFX01FX1BPU1RHUkVTX1BBU1NXT1JE
