# ─────────────────────────────────────────────────────────────────
# Backend — Kubernetes Deployment + ClusterIP Service
# Cloud provider assumption: Google Kubernetes Engine (GKE)
# Image registry:  REGION-docker.pkg.dev/PROJECT_ID/shopping-app/backend:TAG
# ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-backend
  namespace: shopping
  labels:
    app: shopping-backend
    tier: api
spec:
  replicas: 2                          # Start with 2 replicas; scale via HPA
  selector:
    matchLabels:
      app: shopping-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0                # Zero-downtime rolling deploy
  template:
    metadata:
      labels:
        app: shopping-backend
        tier: api
    spec:
      # ── Security context ────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000

      # ── Init container: wait for Postgres before starting ───────
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for postgres..."; sleep 2;
              done

      containers:
        - name: backend
          image: REGION-docker.pkg.dev/PROJECT_ID/shopping-app/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http

          # ── Environment variables ──────────────────────────────
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5000"
            # Non-sensitive config from ConfigMap
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: shopping-config
                  key: JWT_EXPIRES_IN
            # Sensitive values from Secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopping-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopping-secret
                  key: JWT_SECRET

          # ── Resource limits ────────────────────────────────────
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # ── Readiness probe ────────────────────────────────────
          # Pod only receives traffic when Express is ready
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          # ── Liveness probe ─────────────────────────────────────
          # Restart container if it becomes unresponsive
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          # ── Startup probe ──────────────────────────────────────
          # Give extra time on first boot (DB migrations may run)
          startupProbe:
            httpGet:
              path: /api/health
              port: 5000
            failureThreshold: 10
            periodSeconds: 5

---
# ─────────────────────────────────────────────────────────────────
# Backend Service — ClusterIP (internal only; exposed via Ingress)
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: shopping-backend-service
  namespace: shopping
  labels:
    app: shopping-backend
spec:
  type: ClusterIP
  selector:
    app: shopping-backend
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP

---
# ─────────────────────────────────────────────────────────────────
# Horizontal Pod Autoscaler — scale backend on CPU
# ─────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shopping-backend-hpa
  namespace: shopping
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shopping-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
