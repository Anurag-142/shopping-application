version: "3.9"

# ─────────────────────────────────────────────────────────────────
# Shared network — all services communicate on this bridge
# ─────────────────────────────────────────────────────────────────
networks:
  shopping_net:
    driver: bridge

# ─────────────────────────────────────────────────────────────────
# Named volumes for persistent PostgreSQL data
# ─────────────────────────────────────────────────────────────────
volumes:
  postgres_data:

services:
  # ──────────────────────────────────────────────────────────────
  # PostgreSQL — managed database (local dev only)
  # ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: shopping_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopping_db
      POSTGRES_USER: shopping_user
      POSTGRES_PASSWORD: shopping_pass   # override with a .env file in CI/CD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"                      # expose to host for psql / pgAdmin access
    networks:
      - shopping_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping_user -d shopping_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────
  # Backend — Node.js + Express API
  # ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: shopping_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      # Database connection — individual vars consumed by src/config/db.js
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: shopping_db
      DB_USER: shopping_user
      DB_PASSWORD: shopping_pass
      JWT_SECRET: change_me_in_production_use_a_long_random_string
      JWT_EXPIRES_IN: 7d
      # Allow requests from the frontend (port 3000 in Docker)
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "5000:5000"
    networks:
      - shopping_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────────────────────
  # Frontend — Vite build → Nginx static server
  # ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
      args:
        # In compose, API calls are proxied through Nginx or go directly
        # to the backend container on the Docker network
        VITE_API_BASE_URL: http://localhost:5000/api
    container_name: shopping_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - shopping_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
